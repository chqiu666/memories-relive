<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Point Cloud Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 300px;
            z-index: 100;
        }

        #info-panel h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        #info-panel p {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        input[type="range"] {
            width: 120px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 200;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #stats {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading point cloud...</p>
    </div>

    <div id="info-panel">
        <h1>Point Cloud Viewer</h1>
        <p><strong>Controls:</strong></p>
        <p>🖱️ Left click + drag to rotate</p>
        <p>🖱️ Right click + drag to pan</p>
        <p>🖱️ Scroll to zoom</p>
        <div id="stats"></div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label for="point-size">Point Size:</label>
            <input type="range" id="point-size" min="0.001" max="1" step="0.005" value="0.10">
            <span id="point-size-value">0.10</span>
        </div>
        <button id="reset-camera">Reset View</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        camera.position.set(0, 0, 5);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.minDistance = 1;
        controls.maxDistance = 1000;
        controls.zoomSpeed = 1.5;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        // Point cloud variable
        let pointCloud = null;
        let pointsMaterial = null;

        // Load PLY file
        const loader = new PLYLoader();
        loader.load(
            'GSAPP-making.ply',
            function (geometry) {
                // Create material for points
                pointsMaterial = new THREE.PointsMaterial({
                    size: 0.10,
                    vertexColors: true,
                    sizeAttenuation: true
                });

                // Create point cloud
                pointCloud = new THREE.Points(geometry, pointsMaterial);
                scene.add(pointCloud);

                // Center the geometry
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                pointCloud.position.sub(center);

                // Calculate bounding sphere for camera positioning
                geometry.computeBoundingSphere();
                const radius = geometry.boundingSphere.radius;
                const distance = radius * 1.5;
                camera.position.set(distance, distance * 0.5, distance);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                // Update stats
                const pointCount = geometry.attributes.position.count;
                document.getElementById('stats').innerHTML = `
                    <p style="margin-top: 10px;"><strong>Points:</strong> ${pointCount.toLocaleString()}</p>
                    <p><strong>File:</strong> GSAPP-making.ply</p>
                `;

                // Hide loading
                document.getElementById('loading').classList.add('hidden');
            },
            function (xhr) {
                const percentComplete = (xhr.loaded / xhr.total * 100).toFixed(0);
                document.querySelector('#loading p').textContent = `Loading point cloud... ${percentComplete}%`;
            },
            function (error) {
                console.error('Error loading PLY file:', error);
                document.querySelector('#loading p').textContent = 'Error loading point cloud. Please check console.';
            }
        );

        // Point size control
        const pointSizeSlider = document.getElementById('point-size');
        const pointSizeValue = document.getElementById('point-size-value');
        
        pointSizeSlider.addEventListener('input', (e) => {
            const size = parseFloat(e.target.value);
            pointSizeValue.textContent = size.toFixed(2);
            if (pointsMaterial) {
                pointsMaterial.size = size;
            }
        });

        // Reset camera button
        document.getElementById('reset-camera').addEventListener('click', () => {
            if (pointCloud) {
                const geometry = pointCloud.geometry;
                const radius = geometry.boundingSphere.radius;
                const distance = radius * 2.5;
                
                camera.position.set(distance, distance * 0.5, distance);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
